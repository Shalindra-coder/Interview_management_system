
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Listing</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
			background-image: url('https://t3.ftcdn.net/jpg/02/27/64/36/360_F_227643697_wQEqPFyvZEvjnomWrW6XvkH6q1Jj4Feq.jpg');
			background-size: cover;
        }
        
        .job-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 20px;
        }

        p {
            font-size: 1rem;
            color: #555;
            margin: 10px 0;
        }

        .job-title {
            font-size: 2rem;
            font-weight: bold;
            color: #2c3e50;
        }

        .job-info {
            margin: 20px 0;
            font-size: 1rem;
            color: #34495e;
        }

        .job-info p {
            margin: 5px 0;
        }

        .job-button {
            text-align: center;
            margin-top: 30px;
        }

        .job-button button {
            background-color: #2980b9;
            color: white;
            font-size: 1.1rem;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .job-button button:hover {
            background-color: #3498db;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .job-container {
                padding: 15px;
            }

            h1 {
                font-size: 2rem;
            }

            p {
                font-size: 0.9rem;
            }

            .job-button button {
                padding: 12px 25px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="job-container">
        <h1 class="job-title">{{ doc.job_title }}</h1>

        <div class="job-info">
            <p><strong>Company Name:</strong> {{ doc.company_name }}</p>
            <p><strong>Location:</strong> {{ doc.address }}</p>
            <p><strong>Job Type:</strong> {{ doc.job_type }}</p>
            <p><strong>Posted Date:</strong> {{ doc.posted_date }}</p>
            <!-- <p><strong>Description:</strong> {{ doc.discription }}</p> -->
            <p><strong>Openings:</strong> {{ doc.opening }}</p>
        </div>

        <div class="job-button">Read More Information
            <a href="/{{ doc.route | e }}">
                <button>Click Now</button>
            </a>
        </div>
    </div>

</body>
</html>
