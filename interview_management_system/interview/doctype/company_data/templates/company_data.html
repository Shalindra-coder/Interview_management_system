<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Opening</title>
    
</head>
<style>
    /* General styling */
body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f9;
    margin: 0;
    padding: 0;
    background-image: url('https://img.freepik.com/free-photo/top-view-international-worker-s-day-still-life_23-2150337544.jpg?semt=ais_hybrid');
    background-size: cover;
}

/* Container for both sections */
.container {
    max-width: 1200px;
    margin: 50px auto;
    padding: 20px;
    background-color: #fff;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    border-radius: 10px;
}

/* Job Information Section */
.job-info {
    margin-bottom: 30px;
}

.job-info h1 {
    color: #2c3e50;
    font-size: 32px;
}

.job-info p {
    font-size: 18px;
    color: #7f8c8d;
    margin: 5px 0;
}

.job-info strong {
    color: #2c3e50;
}

/* Apply Now Button */
.apply-now {
    text-align: center;
}

.apply-now button {
    width: 200px;
    padding: 15px;
    background-color: #27ae60;
    color: #fff;
    border: none;
    border-radius: 5px;
    font-size: 18px;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

.apply-now button:hover {
    background-color: #2ecc71;
}

</style>
<body>
    <div class="container">
        <!-- Job Information Section -->
        <div class="job-info">
            <h1>{{ doc.job_title }}</h1>
            <p><strong>Company Name:</strong> {{ doc.company_name }}</p>
            <p><strong>Location:</strong> {{ doc.address }}</p>
            <p><strong>Job Type:</strong> {{ doc.job_type }}</p>
            <p><strong>Posted Date:</strong> {{ doc.posted_date }}</p>
            <p><strong>Description:</strong> {{ doc.discription }}</p>
            <p><strong>Openings Available:</strong> {{ doc.opening }}</p>
        </div>

        <!-- Apply Now Button -->
        <div class="apply-now">
            <a href="/job-application-form" target="_blank">
                <button>Apply Now</button>
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
